# Fork bundle patch: re-point the existing usage row at this package.
#
# The stock web bundle already inserts the row (`web-ui-usage`) that mounts this
# package's host half (ledger, provider probes, /api/dsh-usage routes) and its
# browser half (lib/client.js). Installing the fork therefore only needs the
# profile's dependency entry to resolve `@linxin666/dsh-usage` to this copy;
# inserting a second row here would mount the plugin twice.
- id: web-ui-usage
  name: '@linxin666/dsh-usage'
