# Standalone usage plugin.
#
# This patch inserts its own row (`dsh-usage`). If the dsh-web bundle is also
# installed it already carries a usage row (`web-ui-usage`) for
# `@linxin666/dsh-usage`; leave that one enabled and the page mounts twice.
# Disable the bundled row first:
#
#   include:web-ui-usage  ->  enabled: false
#
- insert:
    - id: dsh-usage
      name: '@legifyx/dsh-usage'
